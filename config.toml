# Settings for the Rheinbank DORA agent.
# No secrets here. API keys come only from environment variables (CLAUDE.md hard rule 5).

[connectors]
# Longest search text the agent may send to find_service.
max_query_chars = 100
# Most matches find_service returns in one call.
max_find_results = 5
# Longest free-text note any connector returns. Longer notes are cut.
max_text_chars = 500
# Most records (problems, alerts, notices) any other lookup returns in one call.
max_results = 10
# get_outage_timeline searches at most this many hours before and after the given time.
max_timeline_window_hours = 72
# get_client_impact searches a window of at most this many days.
max_impact_window_days = 366
# get_security_alerts searches a window of at most this many days (by detection time).
max_alert_window_days = 31
# get_supplier_notices searches a window of at most this many days.
max_notice_window_days = 366

[llm]
# All LLM calls go through one provider interface (CLAUDE.md hard rule 7). Change the provider here.
provider = "groq"
model = "openai/gpt-oss-120b"
# The API key is NOT here. It comes only from this environment variable (hard rule 5).
api_key_env = "GROQ_API_KEY"
# Seconds before one LLM call is given up (security framework: timeouts on LLM calls).
timeout_seconds = 30
# How many times the client may retry a failed call before giving up.
max_retries = 1
# Most tokens the LLM may write in one answer.
max_output_tokens = 2000
# 0 = as repeatable as possible.
temperature = 0
# Rate limits (HTTP 429): how many times one call waits and tries again. The wait is the one the
# provider suggests, if it sends one, else 2, 4, 8, 16 ... seconds.
rate_limit_retries = 4
# Most seconds one LLM call may spend waiting on rate limits and dropped connections, in total.
# Keeps every run bounded (hard rule 8).
rate_limit_max_wait_seconds = 90
# Dropped connections: how many times one call waits and tries again (same waits, same total cap).
connection_retries = 2
# Pace calls to stay under this many tokens per minute (Groq free tier: 8000). 0 = no pacing.
tokens_per_minute = 8000
# How much the model reasons before it answers: "low", "medium" or "high" ("" = not sent; Groq then uses
# the model's default, "medium" for gpt-oss). Reasoning tokens count as output tokens against the limit
# above. "low" chosen to make runs faster (approved by Sam on 11 November 2026). Checked against the
# pinned Groq SDK 1.7.0, whose description of the field lists low, medium and high for gpt-oss models.
reasoning_effort = "low"

[agent]
# Hard limits on the agent loop (CLAUDE.md hard rule 8). When one is reached, the run stops,
# the rules engine gives its result on the facts so far, and the missing facts are listed.
# Most LLM calls in one run.
max_steps = 12
# Most tool calls in one run, counted across all steps.
max_tool_calls = 25
# Most tool calls the LLM may propose in one answer. Extra ones are not run.
max_tool_calls_per_step = 6
# Most times one run may stop to ask the human.
max_human_rounds = 3
# Longest ticket accepted, in characters (security framework: input length limits).
max_ticket_chars = 2000
# Longest tool result sent back to the LLM, as JSON text.
max_tool_result_chars = 8000
# Security alert search around the reported time when the gate depends only on G-c (gate check).
gate_check_alert_days_before = 7
gate_check_alert_days_after = 1
# Most repeated identical lookups in one run. A repeat gets the earlier result back, not a new lookup.
# After this many, the agent stops asking the LLM and goes to the human questions, or ends.
max_repeated_calls = 2
# Hard total time limit for one run, in seconds of the agent's own working time (block 6 step 3, approved
# by Sam on 8 November 2026). Time spent waiting for a person to answer does not count. No AI call, pacing
# wait or retry wait may go past it. The slowest measured live run took 7 min 13 s (B03, 6 November 2026).
max_run_seconds = 600
# get_client_impact without a window (window hardening, C01 live test, approved by Sam on 13 November 2026):
# code searches from the known incident start to the known restore time. Where one is not known yet, it uses
# this many days before or after the reported time instead.
client_impact_default_days = 7

[notification]
# Block 5b: the draft initial notification. Nothing is ever sent.
# Longest description (field 2.4) accepted from the AI, in characters. Longer drafts are replaced by
# the description written by code. RTS-R recital 2: keep the initial notification to the most significant facts.
max_description_chars = 1500
# Longest text a human may type for the possible causes (goes into field 2.4).
max_causes_chars = 500
